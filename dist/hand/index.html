<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- 3つのライブラリを読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>
    <div class="container">
        <!-- Webカメラの映像（入力） -->
        <video id="input"></video>
        <!--  認識した手の形状を可視化した映像（出力）  -->
        <canvas id="output" width="600" height="400"></canvas>
    </div>
    <button id="start">start</button>
    <button id="stop">stop</button>

    <div id="text"></div>

    <script>
const video = document.getElementById('input');
const canvas = document.getElementById('output');
const ctx = canvas.getContext('2d');
const text = document.getElementById('text');

const config = {
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
};

const hands = new Hands(config);

const camera = new Camera(video, {
  onFrame: async () => {
    await hands.send({image: video});
  },
  width: 600,
  height: 400
});

hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

document.getElementById('start')
    .addEventListener('click', () => camera.start());


document.getElementById('stop')
    .addEventListener('click', () =>  camera.stop());

let thumbTipY = 0;
let indexTipY = 0;
let before = 0;
let now = 0;

hands.onResults(results => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(results.image,0,0,canvas.width,canvas.height);

    if(results.multiHandLandmarks?.length > 0) {

        // console.log('results: ');
        // console.log(results);

        results.multiHandLandmarks.forEach(marks => {

            console.log('marks: ');
            console.log(marks);

          // 緑色の線で骨組みを可視化
          drawConnectors(ctx, marks, HAND_CONNECTIONS, {color: '#0f0'});

          // 赤色でランドマークを可視化
          drawLandmarks(ctx, marks, {color: '#f00'});

          console.log(marks[8]);

          thumbTipY = marks[4]?.y;
          indexTipY = marks[8]?.y;
          now = 2 - thumbTipY - indexTipY;

          if(now > before){
            text.innerText = '広がる';
          } else {
            text.innerText = '狭まる';
          }

          before = now;
          // if(marks[8]){
          //   text.innerText = '人差し指先が登場';
          // } else {
          //   text.innerText = '';
          // }

        })

    }else{
      text.innerText = '';
    }
});
    </script>
</body>
</html>
